    <h3 style="font-family:calbri;><b> Abstract: Nanobots are tiny machines created to carry out tasks on a nanoscale within the human body, these robots have a potential to deliver targeted drugs therapies, perform minimally invasive procedures, and improve efficiency in treatments for diseases such as cancer and diabetes. There are four main types of nanobots that are powered through various methods. Despite their promise they face challenges due to the excessive cost, immune response, and current materials available. However, with ongoing investigations and advancements in technology many issues are slowly being solved. With more research and funding nanorobots could transform modern healthcare providing new, less invasive treatments for diseases.</b></h3>
